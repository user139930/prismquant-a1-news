<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismQuant · A1 新聞情報</title>
<style>
:root{--ink:#1b2430;--red:#c8453a;--green:#1f7a63;--bg:#f4f5f7;--card:#fff;--line:#e6e9ee;--muted:#6b7280;--soft:#eef1f5}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.topbar{background:var(--card);border-bottom:1px solid var(--line);border-top:3px solid var(--red)}
.topbar .inner{max-width:960px;margin:0 auto;padding:16px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700}
.brand .a1{color:var(--red)}
.pipe{color:var(--muted);font-size:12.5px}
main{max-width:960px;margin:0 auto;padding:24px 20px 64px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
button{background:var(--ink);color:#fff;border:0;padding:10px 18px;border-radius:6px;font-size:13.5px;cursor:pointer;font-weight:600;letter-spacing:.2px}
button:hover{opacity:.88}
button:disabled{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.stat .n{font-family:Georgia,serif;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;font-weight:600}
.stat .l{color:var(--muted);font-size:11.5px;margin-top:8px;letter-spacing:.6px}
.stat .n.bull{color:var(--red)}
.stat .n.bear{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;transition:border-color .15s}
.card:hover{border-color:#d3d9e0}
.row1{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.row1 h3{margin:0;font-size:15px;font-weight:600;flex:1;line-height:1.45}
.badge{display:inline-block;padding:2px 10px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:.5px}
.bull{background:var(--red)}
.bear{background:var(--green)}
.neu{background:#8a8f98}
.summary{color:#3a4654;font-size:13.5px;margin:2px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--soft);border-radius:5px;padding:2px 8px;font-size:11px;color:#3a4654}
.tag.inst{background:#f6e9e7;color:var(--red)}
.meta{margin-top:12px;color:var(--muted);font-size:11.5px;display:flex;gap:16px;flex-wrap:wrap}
.pipeline{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.pipeline .tt{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.5px}
.pipeline .steps{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{background:var(--soft);border-radius:6px;padding:6px 12px;font-size:12.5px;color:#3a4654}
.arrow{color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:48px;text-align:center;color:var(--muted)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.row1{flex-direction:column}}
</style>
</head>
<body>
<div class="topbar"><div class="inner">
  <span class="brand">PrismQuant <span class="a1">· A1 新聞情報</span></span>
  <span class="pipe">多源抓取 → 去重 → 大模型摘要／情緒／主題標籤</span>
</div></div>
<main>
  <div class="toolbar">
    <button id="refresh" onclick="collect()">↻ 採集最新新聞</button>
    <span class="hint" id="status">讀取中…</span>
  </div>
  <div class="stats" id="stats"></div>
  <div id="cards"></div>
  <div class="pipeline">
    <div class="tt">這個智能體在背後做了四步</div>
    <div class="steps">
      <span class="step">① 抓取 RSS 新聞源</span><span class="arrow">→</span>
      <span class="step">② 標題去重</span><span class="arrow">→</span>
      <span class="step">③ 大模型摘要＋情緒＋主題</span><span class="arrow">→</span>
      <span class="step">④ 存進資料庫</span>
    </div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cls(s){if(/利多|正面|看漲|bullish/i.test(s||''))return'bull';if(/利空|負面|看跌|bearish/i.test(s||''))return'bear';return'neu'}
function pct(n){return n==null?'—':Math.round(n*100)+'%'}
function render(d){
  const evs=d.events||[];
  const bull=evs.filter(e=>cls(e.sentiment)==='bull').length;
  const bear=evs.filter(e=>cls(e.sentiment)==='bear').length;
  const neu=evs.length-bull-bear;
  $('#stats').innerHTML=
    `<div class="stat"><div class="n">${evs.length}</div><div class="l">新聞總數</div></div>`+
    `<div class="stat"><div class="n bull">${bull}</div><div class="l">利多</div></div>`+
    `<div class="stat"><div class="n bear">${bear}</div><div class="l">利空</div></div>`+
    `<div class="stat"><div class="n">${neu}</div><div class="l">中性</div></div>`;
  if(!evs.length){$('#cards').innerHTML='<div class="empty">還沒有新聞。點上面的「採集最新新聞」抓一批。</div>';return}
  $('#cards').innerHTML=evs.map(e=>{
    const c=cls(e.sentiment);
    const tags=(e.topics||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+
               (e.instruments||[]).map(i=>`<span class="tag inst">${esc(i)}</span>`).join('');
    const meta=`<span>${esc(e.source||'')}</span><span>置信度 ${pct(e.confidence)}</span>`+
               (e.published?`<span>${esc(e.published)}</span>`:'');
    return `<div class="card">
      <div class="row1"><h3>${esc(e.title)}</h3><span class="badge ${c}">${esc(e.sentiment||'中性')}</span></div>
      <div class="summary">${esc(e.summary)}</div>
      <div class="tags">${tags}</div>
      <div class="meta">${meta}</div>
    </div>`;
  }).join('');
}
async function load(){
  try{
    const d=await(await fetch('/api/v1/news/events?limit=50')).json();
    render(d);
    $('#status').textContent=(d.sampled?'示例資料（未連上 RSS）· ':'')+'共 '+d.count+' 條';
  }catch(e){$('#status').textContent='讀取失敗，請確認服務已啟動'}
}
async function collect(){
  const b=$('#refresh');b.disabled=true;b.textContent='採集中…（約 10 秒）';
  $('#status').textContent='正在抓新聞＋大模型分析…';
  try{
    await fetch('/api/v1/news/collect?limit=8',{method:'POST'});
    await load();
  }catch(e){$('#status').textContent='採集失敗'}finally{b.disabled=false;b.textContent='↻ 採集最新新聞'}
}
load();
</script>
</body>
</html>
